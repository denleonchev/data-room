<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonadev Data Room</title>
    <link rel="icon" href="/logo.png" />
    <meta
      name="description"
      content="Bonadev Data Room is a private virtual data room for due diligence: keep deal documents in nested folders and share a room, a folder or a single file read-only with the people who need it."
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Never rendered in a real browser: the app draws the same words itself.
         It is here because Google's OAuth branding review reads the served HTML
         without running JavaScript, and an empty document reads as a page that
         explains nothing. -->
    <noscript>
      <h1>Bonadev Data Room</h1>
      <p>
        Bonadev Data Room is a virtual data room for due diligence: a private
        place to keep the documents a deal depends on. Upload PDFs, organise them
        into nested folders, and share a room, a folder or a single file with the
        people who need it — through a link or with named people only — and
        revoke that access at any time.
      </p>
      <p>
        Signing in — with an email and password, or with Google — gives Bonadev
        Data Room your name, email address and, from Google, your profile
        picture. Nothing else is requested from Google, and nothing is passed on
        to anyone else.
      </p>
      <p>
        <a href="/privacy">Privacy Policy</a> ·
        <a href="/terms">Terms of Service</a>
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
