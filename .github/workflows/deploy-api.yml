name: Deploy API

on:
  push:
    branches: [main]
    # The API and what it's built from; web-only changes don't redeploy it.
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "Dockerfile"
      - ".dockerignore"
      - "infra/deploy.sh"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push image
        id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/data-room-api:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # The script travels with the command, so the instance always runs the
      # version from this commit. Secrets stay on the instance side: it reads
      # its own env from Parameter Store.
      - name: Deploy on the instance
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        run: |
          script=$(base64 -w0 infra/deploy.sh)
          jq -n --arg cmd "echo $script | base64 -d > /tmp/deploy.sh && bash /tmp/deploy.sh $IMAGE" \
            '{commands: [$cmd], executionTimeout: ["900"]}' > params.json
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "deploy $GITHUB_SHA" \
            --parameters file://params.json --query Command.CommandId --output text)

          while :; do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; esac
            break
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          test "$status" = Success
